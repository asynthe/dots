# p1's make.conf. Source: ~/git/dots/gentoo/portage/, copied to /etc/portage by
# gentoo/scripts/02-portage.sh apply (never edit /etc/portage directly: the next apply reverts it).
# Global settings go here; package.env only holds per-package exceptions (env/*.conf).

# Not -march=native: it reports different cache sizes per core type on this hybrid CPU, and
# gcc's PGO bootstrap aborts on that (bug #915389). This is native minus the cache params.
# LTO for every C/C++/Fortran package: -flto=auto (parallel LTO link), -fno-semantic-interposition
# (calls inside a shared lib can be inlined). Packages that break: package.env/no-lto.
# Rust ignores these; cargo's profiles decide its LTO.
COMMON_FLAGS="-march=meteorlake -mabm -mshstk -mno-kl -mno-pconfig -mno-sgx -mno-widekl -O2 -pipe -flto=auto -fno-semantic-interposition"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"
RUSTFLAGS="-C target-cpu=native"
GOAMD64="v3"

# ~2 GB RAM per job. Chromium-sized builds get -j8 (package.env/heavy).
MAKEOPTS="-j15 -l22"
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=22 --with-bdeps=y"
# No getbinpkg: the binhost is stable and ignores these flags (install time only, install.md §9).
FEATURES="parallel-fetch parallel-install"
# Builds only get CPU and disk time nothing else wants (a build crawls while you play).
PORTAGE_SCHEDULING_POLICY="idle"
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"

ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"
# lto pgo: only packages that offer the flags (python, bash, xz, binutils, rust, ...). PGO can't be
# a global compiler flag: it needs the ebuild's own training run.
USE="wayland pipewire vaapi vulkan dist-kernel systemd bluetooth secureboot modules-sign -gnome -kde lto pgo"
VIDEO_CARDS="intel nvidia"
INPUT_DEVICES="libinput"
GRUB_PLATFORMS=""
L10N="en es ja"

MICROCODE_SIGNATURES="-S"
SECUREBOOT_SIGN_KEY="/var/lib/sbctl/keys/db/db.key"
SECUREBOOT_SIGN_CERT="/var/lib/sbctl/keys/db/db.pem"
MODULES_SIGN_KEY="/etc/kernel/certs/signing_key.pem"
MODULES_SIGN_CERT="/etc/kernel/certs/signing_key.pem"
