COMMON_FLAGS="-march=meteorlake -mabm -mshstk -mno-kl -mno-pconfig -mno-sgx -mno-widekl -O2 -pipe -flto=auto -fno-semantic-interposition"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"
RUSTFLAGS="-C target-cpu=native"
GOAMD64="v3"

MAKEOPTS="-j15 -l22"
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=22 --with-bdeps=y"
FEATURES="parallel-fetch parallel-install"
PORTAGE_SCHEDULING_POLICY="idle"
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"

ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"
USE="wayland pipewire vaapi vulkan dist-kernel systemd bluetooth secureboot modules-sign -gnome -kde lto pgo"
VIDEO_CARDS="intel nvidia"
INPUT_DEVICES="libinput"
GRUB_PLATFORMS=""
L10N="en es ja"

MICROCODE_SIGNATURES="-S"
SECUREBOOT_SIGN_KEY="/var/lib/sbctl/keys/db/db.key"
SECUREBOOT_SIGN_CERT="/var/lib/sbctl/keys/db/db.pem"
MODULES_SIGN_KEY="/etc/kernel/certs/signing_key.pem"
MODULES_SIGN_CERT="/etc/kernel/certs/signing_key.pem"
