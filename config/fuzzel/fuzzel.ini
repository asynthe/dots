# ~/.config/fuzzel/fuzzel.ini

[main]
font=JetBrains Mono Nerd Font:size=12
prompt=  
terminal=foot -e
width=45
lines=10
line-height=22px
letter-spacing=0
horizontal-pad=20
vertical-pad=12
inner-pad=6
image-size-ratio=0.5
icons-enabled=yes
icon-theme=Papirus-Dark
fuzzy=yes
show-actions=yes
layer=overlay

[colors]
background=000000f0
text=e6edf3ff
match=58a6ffff
selection=161b22ff
selection-text=e6edf3ff
selection-match=79c0ffff
border=30363dff

[border]
width=1
radius=0
