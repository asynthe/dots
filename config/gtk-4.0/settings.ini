[Settings]
# Also drives Firefox's chrome (tabs, menus, dialogs).
gtk-font-name=JetBrainsMono Nerd Font 11
gtk-application-prefer-dark-theme=1
# Qt reads this through the gtk3 platform theme; without it every themed
# icon (tray, menus) resolves to nothing. Fluent comes from
# scripts/desktop/install-theme.sh; before that runs, only hicolor icons show.
gtk-icon-theme-name=Fluent-dark
gtk-enable-event-sounds=0
gtk-enable-input-feedback-sounds=0
