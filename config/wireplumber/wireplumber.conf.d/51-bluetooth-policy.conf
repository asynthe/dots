# Keep Bluetooth headsets on their high-quality A2DP profile instead of
# auto-switching to the low-quality HSP/HFP "headset" profile (mono,
# narrowband/wideband call codec) whenever an app merely opens the mic.
#
# With this off, the mic input simply won't appear/activate automatically;
# switch to the headset/HFP profile manually (pavucontrol / wpctl) only when
# you actually need to make a call.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
