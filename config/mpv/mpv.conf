osc=yes
fullscreen=no
keep-open=no
save-position-on-quit=yes
screenshot-directory="~/downloads/screenshots/mpv" # mpv expands ~/, not $HOME
screenshot-template="%F_$03n"
volume-max=100

hwdec=nvdec
profile=high-quality

[linux]
profile-cond=platform == "linux"
gpu-context=wayland

[norm]
profile-desc="Normalize audio volume"
af=lavfi=[loudnorm=I=-16:TP=-3:LRA=4]

alang=jpn,jp,eng,en # Audio
slang=jpn,jp,eng,en # Subs

sid=5
secondary-sid=2
sub-visibility=yes
secondary-sub-visibility=yes
secondary-sub-pos=88

sub-font=Noto Sans
sub-scale=1
sub-font-size=36

[protocol.http]
cache=yes
hls-bitrate=max # Use max quality for HLS streams
no-cache-pause # Don't pause when the cache runs low
no-resume-playback

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http

[extension.flac]
fullscreen=no

[extension.mp4]
loop-file=inf
fullscreen=no
keep-open

[extension.gif]
loop-file=inf
keep-open

[extension.webm]
loop-file=inf
keep-open
