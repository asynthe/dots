# ───────────────────────── Font ─────────────────────────
# TX-02, matching ghostty/alacritty/wezterm. Each width is its own style
# string in this family, and kitty picks bold/italic independently of
# font_family, so all four faces are named explicitly -- otherwise bold
# falls back to the full-width cut and the line jitters.
#
# No symbol_map: kitty 0.32+ bundles Symbols Nerd Font Mono and maps the
# Nerd Font codepoints itself, which covers what TX-02 lacks.
font_family      family="TX-02" style="Condensed"
bold_font        family="TX-02" style="Bold Condensed"
italic_font      family="TX-02" style="Condensed Oblique"
bold_italic_font family="TX-02" style="Bold Condensed Oblique"
font_size 14.0
