db_file "~/.config/mpd/database"
log_file "~/.config/mpd/log"

music_directory "~/archive/music"

log_level	"notice"
auto_update	"yes"
bind_to_address "127.0.0.1"

audio_output {
	type		"pipewire"
	name		"PipeWire Sound Server"
}

audio_output {
type            "fifo"
name            "my_fifo"
path            "/tmp/mpd.fifo"
format          "44100:16:2"
}
