general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

auth {
    fingerprint {
        enabled = true
    }
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.02
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 140
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color = rgba(255, 255, 255, 0.85)
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 260, 50
    rounding = 25
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(255, 255, 255, 0.4)
    inner_color = rgba(20, 20, 20, 0.55)
    font_color = rgba(255, 255, 255, 0.95)
    placeholder_text = <span foreground="##ffffffaa">Sign in</span>
    fail_text = <span foreground="##ff8080">Wrong password</span>
    check_color = rgba(255, 255, 255, 0.8)
    fade_on_empty = false
    position = 0, 50
    halign = center
    valign = bottom
}

label {
    monitor =
    text = Press Enter to sign in, or use your fingerprint
    color = rgba(255, 255, 255, 0.55)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 15
    halign = center
    valign = bottom
}
