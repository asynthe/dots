## cava config for the quickshell bar's center visualizer widget.
## Raw ascii bar-height stream, parsed directly in bar/shell.qml (not for
## terminal viewing — that's the default ~/.config/cava/config).

[general]
bars = 40
framerate = 30
autosens = 1
sensitivity = 100
sleep_timer = 0

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 0.77
monstercat = 0
waves = 0
