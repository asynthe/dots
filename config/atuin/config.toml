auto_sync = false
sync_frequency = "5m"
sync_address = "https://api.atuin.sh"
search_mode = "fuzzy"
invert = true
enter_accept = true

store_failed = false

## Commands matching any of these regexes are never recorded.
## Regexes are unanchored, so anchor with ^ / $ to avoid over-matching.
## Applies to NEW commands only -- run `atuin history prune` to clear old ones.
history_filter = [
  "^(ls|ll|la|lt|l)(\\s|$)",
  "^cd(\\s|$)",
  "^(cat|bat)\\s",
  "^(pwd|clear|exit|history|h)$",
  "^(yy|lf|yazi)(\\s|$)",
]

## Directories whose commands are never recorded.

[sync]
records = true
