[Settings]
# Also drives Firefox's chrome (tabs, menus, dialogs).
gtk-font-name=JetBrainsMono Nerd Font 14
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
# Qt reads this through the gtk3 platform theme; without it every themed
# icon (tray, menus) resolves to nothing. Adwaita is the only theme installed.
gtk-icon-theme-name=Adwaita
